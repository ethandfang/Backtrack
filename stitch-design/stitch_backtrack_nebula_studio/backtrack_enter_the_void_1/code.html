<!-- Interactive Layer / Starfield Script -->
<script>
        const canvas = document.getElementById('starfield');
        const ctx = canvas.getContext('2d');

        let width, height, stars;

        function init() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;

            stars = [];
            const count = 150;

            for (let i = 0; i < count; i++) {
                stars.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    size: Math.random() * 1.5,
                    opacity: Math.random(),
                    speed: 0.05 + Math.random() * 0.1
                });
            }
        }

        function draw() {
            ctx.clearRect(0, 0, width, height);

            stars.forEach(star => {
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 255, 255, ${star.opacity})`;
                ctx.fill();

                // Drifting movement
                star.y -= star.speed;
                if (star.y < 0) {
                    star.y = height;
                    star.x = Math.random() * width;
                }

                // Twinkle effect
                star.opacity += (Math.random() - 0.5) * 0.05;
                if (star.opacity < 0.1) star.opacity = 0.1;
                if (star.opacity > 0.8) star.opacity = 0.8;
            });

            requestAnimationFrame(draw);
        }

        window.addEventListener('resize', init);
        
        function handleEnter() {
            const main = document.querySelector('main');
            main.style.transition = 'all 1.5s cubic-bezier(0.4, 0, 0.2, 1)';
            main.style.opacity = '0';
            main.style.transform = 'scale(1.1) translateY(-20px)';
            
            setTimeout(() => {
                // Future navigation logic would go here
                console.log('Transitioning to Beat Lab...');
            }, 1000);
        }

        init();
        draw();
    </script>
